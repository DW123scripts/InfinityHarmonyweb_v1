<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony Project to ABC Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
        <h1 class="text-2xl font-black text-slate-800 mb-2">Converter</h1>
        <p class="text-slate-500 text-sm mb-6">Upload your <strong>old format</strong> (.json/.txt) to convert it to <strong>ABCJS format</strong> (.abc).</p>
        
        <div class="space-y-4">
            <div id="drop-zone" class="border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer">
                <input type="file" id="file-input" class="hidden" accept=".json,.txt">
                <div class="text-slate-400">
                    <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <span class="text-sm font-bold">Click to upload or drag & drop</span>
                </div>
            </div>

            <div id="status" class="hidden p-4 rounded-xl text-xs font-mono bg-slate-100 text-slate-600 break-words"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const status = document.getElementById('status');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    convertAndDownload(data);
                } catch (err) {
                    status.classList.remove('hidden');
                    status.innerText = "Error: This doesn't look like the old JSON format.";
                }
            };
            reader.readAsText(file);
        }

        function convertAndDownload(data) {
            const title = data.title || 'Converted_Project';
            const lyricist = data.lyricsBy || '';
            const composer = data.musicBy || '';
            const time = data.timeSignature || '4/4';
            const bpm = data.bpm || '120';
            const partsCount = parseInt(data.voices) || 1;
            
            // Start ABC Header
            let abc = `X:1\nT:${title}\n`;
            if (lyricist) abc += `w:${lyricist}\n`;
            if (composer) abc += `C:${composer}\n`;
            abc += `M:${time}\nL:1/4\nQ:1/4=${bpm}\nK:C\n`;

            // Process each voice
            for (let i = 0; i < partsCount; i++) {
                abc += `V:${i + 1} clef=${(i + 1) <= 2 ? 'treble' : 'bass'}\n`;
                
                if (data.music && Array.isArray(data.music)) {
                    data.music.forEach(section => {
                        const notes = section.voices[i] || "z4";
                        abc += notes + " ";
                        
                        // Handle Lyrics
                        if (data.multiVoiceLyrics) {
                            const lyric = section.lyrics[i];
                            if (lyric) abc += `\nw: ${lyric.replace(/\n/g, ' ')}\n`;
                        } else if (i === 0) { // Default lyrics align to first voice
                            const lyric = section.lyrics[0];
                            if (lyric) abc += `\nw: ${lyric.replace(/\n/g, ' ')}\n`;
                        }
                    });
                }
                abc += "\n";
            }

            // Create download
            const blob = new Blob([abc], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title.replace(/\s+/g, '_')}.abc`;
            a.click();

            status.classList.remove('hidden');
            status.className = "p-4 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-700";
            status.innerText = "Success! ABC file downloaded.";
        }

        // Drag and drop handlers
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-blue-500');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500');
            handleFile(e.dataTransfer.files[0]);
        };
    </script>
</body>
</html>
